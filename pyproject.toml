[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "fich-mcp"
version = "0.1.0"
description = "Local read-only FICH Moodle MCP companion"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "mcp==2.1.1", "pypdf>=6.17,<7"]
[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "reportlab>=4,<5", "ruff>=0.16,<0.17"]
[project.scripts]
fich-mcp = "fich_mcp.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
